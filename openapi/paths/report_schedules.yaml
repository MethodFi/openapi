collection:
  get:
    operationId: listReportSchedules
    summary: List report schedules
    description: Returns the report schedules configured for the team.
    tags:
    - Report Schedules
    security:
    - SecretKey: []
    parameters:
    - $ref: ../components/parameters/method_version.yaml
    responses:
      '200':
        description: A list of report schedules.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleListResponse
      '400':
        $ref: ../components/responses/error.yaml#/BadRequest
      '401':
        $ref: ../components/responses/error.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/error.yaml#/Forbidden
      '429':
        $ref: ../components/responses/error.yaml#/RateLimited
      '500':
        $ref: ../components/responses/error.yaml#/InternalError
  post:
    operationId: createReportSchedule
    summary: Create a report schedule
    description: >-
      Creates a new active report schedule for a single supported Report `type`. Once
      created, the schedule runs on Method's standard cadence for that type. A team may
      have only one active schedule per `type`; creating a duplicate returns an error.
    tags:
    - Report Schedules
    security:
    - SecretKey: []
    parameters:
    - $ref: ../components/parameters/method_version.yaml
    - $ref: ../components/parameters/idempotency_key.yaml
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleCreateRequest
          example:
            type: payments.created.previous_day
            email_recipients:
            - reports@example.com
    responses:
      '200':
        description: The newly created report schedule.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleResponse
      '400':
        $ref: ../components/responses/error.yaml#/BadRequest
      '401':
        $ref: ../components/responses/error.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/error.yaml#/Forbidden
      '422':
        $ref: ../components/responses/error.yaml#/UnprocessableEntity
      '429':
        $ref: ../components/responses/error.yaml#/RateLimited
      '500':
        $ref: ../components/responses/error.yaml#/InternalError
individual:
  get:
    operationId: retrieveReportSchedule
    summary: Retrieve a report schedule
    description: Returns the report schedule associated with the identifier.
    tags:
    - Report Schedules
    security:
    - SecretKey: []
    parameters:
    - $ref: ../components/parameters/method_version.yaml
    - name: reportScheduleId
      in: path
      required: true
      description: Unique identifier for the report schedule.
      schema:
        type: string
        pattern: ^rpt_sch_\w+$
    responses:
      '200':
        description: The requested report schedule.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleResponse
      '400':
        $ref: ../components/responses/error.yaml#/BadRequest
      '401':
        $ref: ../components/responses/error.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/error.yaml#/Forbidden
      '404':
        $ref: ../components/responses/error.yaml#/NotFound
      '429':
        $ref: ../components/responses/error.yaml#/RateLimited
      '500':
        $ref: ../components/responses/error.yaml#/InternalError
  put:
    operationId: updateReportSchedule
    summary: Update a report schedule
    description: >-
      Updates the `email_recipients` of an existing report schedule. The schedule `type`
      and cadence cannot be changed.
    tags:
    - Report Schedules
    security:
    - SecretKey: []
    parameters:
    - $ref: ../components/parameters/method_version.yaml
    - $ref: ../components/parameters/idempotency_key.yaml
    - name: reportScheduleId
      in: path
      required: true
      description: Unique identifier for the report schedule.
      schema:
        type: string
        pattern: ^rpt_sch_\w+$
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleUpdateRequest
          example:
            email_recipients:
            - ops@example.com
            - reports@example.com
    responses:
      '200':
        description: The updated report schedule.
        content:
          application/json:
            schema:
              $ref: ../components/schemas/report_schedule.yaml#/ReportScheduleResponse
      '400':
        $ref: ../components/responses/error.yaml#/BadRequest
      '401':
        $ref: ../components/responses/error.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/error.yaml#/Forbidden
      '404':
        $ref: ../components/responses/error.yaml#/NotFound
      '422':
        $ref: ../components/responses/error.yaml#/UnprocessableEntity
      '429':
        $ref: ../components/responses/error.yaml#/RateLimited
      '500':
        $ref: ../components/responses/error.yaml#/InternalError
  delete:
    operationId: deleteReportSchedule
    summary: Delete a report schedule
    description: Deletes a report schedule, stopping all future runs. Returns an empty response.
    tags:
    - Report Schedules
    security:
    - SecretKey: []
    parameters:
    - $ref: ../components/parameters/method_version.yaml
    - $ref: ../components/parameters/idempotency_key.yaml
    - name: reportScheduleId
      in: path
      required: true
      description: Unique identifier for the report schedule.
      schema:
        type: string
        pattern: ^rpt_sch_\w+$
    responses:
      '200':
        description: Report schedule deleted successfully.
        content:
          application/json:
            schema:
              type: object
              required: [success, data, message]
              properties:
                success:
                  type: boolean
                  example: true
                data:
                  type: 'null'
                  example: null
                message:
                  type: ['null', string]
                  example: null
      '400':
        $ref: ../components/responses/error.yaml#/BadRequest
      '401':
        $ref: ../components/responses/error.yaml#/Unauthorized
      '403':
        $ref: ../components/responses/error.yaml#/Forbidden
      '404':
        $ref: ../components/responses/error.yaml#/NotFound
      '422':
        $ref: ../components/responses/error.yaml#/UnprocessableEntity
      '429':
        $ref: ../components/responses/error.yaml#/RateLimited
      '500':
        $ref: ../components/responses/error.yaml#/InternalError
