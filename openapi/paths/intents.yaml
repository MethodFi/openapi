post:
  operationId: createIntent
  summary: Create an intent
  description: >-
    Records a user action, such as starting a loan application, along with the identity of the
    user who performed it. Identify the user with their PII in `identity.individual`, or with an
    existing entity in `identity.entity_id`.


    This endpoint must be enabled for your team.
  tags:
  - Intents
  security:
  - SecretKey: []
  parameters:
  - $ref: ../components/parameters/method_version.yaml
  - $ref: ../components/parameters/idempotency_key.yaml
  requestBody:
    required: true
    description: >-
      `identity` requires exactly one of `individual` or `entity_id`. `identity.individual` requires
      `first_name`, `last_name`, and a non-null value for at least one of `phone`, `dob`, or
      `address`.
      `identity.entity_id` must be an entity that belongs to your team; otherwise the request fails
      with `INVALID_ENTITY`. `context` and `metadata` are optional and are returned on the intent;
      `identity` is not returned.
    content:
      application/json:
        schema:
          $ref: ../components/schemas/intent.yaml#/CreateIntentRequest
        examples:
          by_individual:
            summary: Identify the user by PII
            value:
              event: lending.application_started
              identity:
                individual:
                  first_name: Jane
                  last_name: Doe
                  phone: '+15125550123'
                  email: jane@example.com
                  dob: '1990-05-21'
                  address:
                    line1: 123 Main St
                    line2: null
                    city: Austin
                    state: TX
                    zip: '78701'
              context:
                external_user_id: usr_8842
                session_id: sess_51c0
                source: app
              metadata:
                campaign_id: fall_prescreen
          by_entity:
            summary: Identify the user by an existing entity
            value:
              event: user.logged_in
              identity:
                entity_id: ent_au22b1fbFJbp8
              context:
                external_user_id: usr_8842
                source: app
  responses:
    '200':
      description: The created intent.
      content:
        application/json:
          schema:
            $ref: ../components/schemas/intent.yaml#/IntentResponse
    '400':
      $ref: ../components/responses/error.yaml#/BadRequest
    '401':
      $ref: ../components/responses/error.yaml#/Unauthorized
    '403':
      $ref: ../components/responses/error.yaml#/Forbidden
    '429':
      $ref: ../components/responses/error.yaml#/RateLimited
    '500':
      $ref: ../components/responses/error.yaml#/InternalError
