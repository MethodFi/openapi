Preauth:
  type: object
  description: >-
    A PreauthSignals assessment returns the predicted likelihood that a transaction will
    succeed, alongside verified ownership of the card and recommended retry timing.
    `verified_ownership` and `card_standing` are derived from the identifiers supplied in
    the request and are available to all teams. `success_likelihood` and
    `optimal_retry_date` depend on additional underlying data; when a team is not
    provisioned for that data both fields return `null`, which is a normal response state
    rather than an error.
  required:
  - id
  - account_id
  - status
  - verified_ownership
  - card_standing
  - success_likelihood
  - optimal_retry_date
  - metadata
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the PreauthSignals assessment.
      pattern: ^preauth_\w+$
      example: preauth_qV7kRaFm4JNxw
    account_id:
      type:
      - string
      - 'null'
      description: >-
        The ID of the associated Method Account. Returned whether the account was passed
        in the request or generated from raw card input.
      example: acc_4m9amk4KFiaQX
    status:
      type: string
      description: Current processing status of the assessment.
      enum:
      - pending
      - in_progress
      - completed
      - failed
      example: completed
    verified_ownership:
      type:
      - string
      - 'null'
      description: >-
        The result of matching the provided card details to a known cardholder identity.
        Derived from the request identifiers alone.
      enum:
      - match
      - no_match
      - fuzzy_match
      - identity_not_found
      - unknown
      - null
      example: match
    card_standing:
      type:
      - string
      - 'null'
      description: Current status of the card account at the issuer.
      enum:
      - open
      - closed
      - null
      example: open
    success_likelihood:
      type:
      - number
      - 'null'
      description: >-
        The predicted probability that a charge will succeed under the provided
        conditions, expressed as a decimal from 0.00 to 1.00. Returns `null` when the
        team is not provisioned for the required underlying data.
      minimum: 0
      maximum: 1
      example: 0.87
    optimal_retry_date:
      type:
      - string
      - 'null'
      format: date
      description: >-
        The recommended date on which to attempt or retry the charge. Returns `null` when
        the team is not provisioned for the required underlying data.
      example: '2026-06-02'
    error:
      type:
      - object
      - 'null'
      description: An object representing an error that occurred while processing this request.
      allOf:
      - $ref: common.yaml#/ResourceError
    metadata:
      $ref: common.yaml#/Metadata
    created_at:
      type: string
      format: date-time
      description: Timestamp when the assessment was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the assessment was last updated.
  example:
    id: preauth_qV7kRaFm4JNxw
    account_id: acc_4m9amk4KFiaQX
    status: completed
    verified_ownership: match
    card_standing: open
    success_likelihood: 0.87
    optimal_retry_date: '2026-06-02'
    error: null
    metadata: null
    created_at: '2026-05-28T14:00:00.000Z'
    updated_at: '2026-05-28T14:00:00.180Z'

PreauthCard:
  type: object
  description: >-
    Raw card identifiers for an unauthenticated card. `bin6`, `last4`, `first_name`,
    `last_name`, and `phone` are the inputs used to resolve `verified_ownership`;
    supplying more of them improves match accuracy.
  required:
  - bin6
  - last4
  properties:
    bin6:
      type: string
      description: First six digits of the card number (the bank identification number).
      pattern: ^\d{6}$
      example: '411111'
    last4:
      type: string
      description: Last four digits of the card number.
      pattern: ^\d{4}$
      example: '1234'
    first_name:
      type: string
      description: Cardholder first name.
      example: Jane
    last_name:
      type: string
      description: Cardholder last name.
      example: Doe
    phone:
      type: string
      description: Cardholder phone number in E.164 format.
      example: '+15555555555'
    zip:
      type: string
      description: Cardholder billing postal code.
      example: '10001'

PreauthPurchase:
  type: object
  description: >-
    Optional context describing the transaction being assessed. Supplying purchase
    context improves the accuracy of `success_likelihood`.
  properties:
    amount:
      type: integer
      description: The amount of the transaction in cents (for example, $99.99 = 9999).
      minimum: 1
      example: 9999
    mcc:
      type: string
      description: Merchant category code for the transaction.
      example: '4511'
    ip_address:
      type: string
      description: IP address of the device initiating the transaction.
      example: 203.0.113.42
    txn_time:
      type: string
      format: date-time
      description: Timestamp at which the transaction is attempted.
      example: '2026-05-28T14:00:00Z'

PreauthCreateRequest:
  type: object
  description: >-
    Request to compute a PreauthSignals assessment. Exactly one of `account_id` or `card`
    must be provided; supplying both returns a `400` error.
  properties:
    account_id:
      type: string
      description: The ID of an authenticated Method Account to assess.
      pattern: ^acc_\w+$
      example: acc_4m9amk4KFiaQX
    card:
      $ref: '#/PreauthCard'
    purchase:
      $ref: '#/PreauthPurchase'
    metadata:
      $ref: common.yaml#/Metadata

PreauthResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/Preauth'

PreauthListResponse:
  allOf:
  - $ref: common.yaml#/ListEnvelope
  - type: object
    properties:
      data:
        type: array
        items:
          $ref: '#/Preauth'
