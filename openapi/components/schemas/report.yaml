ReportType:
  type: string
  description: The type of report, determining the data it contains and the window it covers.
  enum:
  # Payments created
  - payments.created.current
  - payments.created.previous
  - payments.created.previous_day
  # Payments updated
  - payments.updated.current
  - payments.updated.previous
  # Payments failed
  - payments.failed.previous_day
  # Payments outstanding, itemized
  - payments.outstanding_itemized.daily
  - payments.outstanding_itemized.total
  - payments.outstanding_itemized.pull_daily
  - payments.outstanding_itemized.pull_total
  - payments.outstanding_itemized.push_daily
  - payments.outstanding_itemized.push_total
  # Payments outstanding, summary
  - payments.outstanding_summary.daily
  - payments.outstanding_summary.total
  - payments.outstanding_summary.pull_daily
  - payments.outstanding_summary.pull_total
  - payments.outstanding_summary.push_daily
  - payments.outstanding_summary.push_total
  # ACH
  - ach.pull.upcoming
  - ach.pull.previous
  - ach.pull.nightly
  - ach.reversals.nightly
  - ach.debit.daily
  # Reversals
  - reversals.pull_funded.previous_day
  - reversals.push_funded.previous_day
  # Entities
  - entities.created.previous_day
  # Balances
  - reserve_fbo_balance.created.previous_day
  - team_fbo_balance.created.previous_day
  example: payments.created.current

Report:
  type: object
  description: A Report is a downloadable file containing aggregated data about payments, entities, or other resources.
  required:
  - id
  - type
  - url
  - status
  - metadata
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the report.
      pattern: ^rpt_\w+$
      example: rpt_cj2mkA3hFyHT5
    type:
      $ref: '#/ReportType'
    url:
      type:
      - string
      - 'null'
      description: Download URL for the completed report. Only available when status is `completed`.
    status:
      type: string
      description: Current processing status of the report.
      enum:
      - processing
      - completed
    metadata:
      $ref: common.yaml#/Metadata
    created_at:
      type: string
      format: date-time
      description: Timestamp when the report was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the report was last updated.
ReportCreateRequest:
  type: object
  description: Request body for creating a report.
  required:
  - type
  properties:
    type:
      $ref: '#/ReportType'
ReportResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/Report'
