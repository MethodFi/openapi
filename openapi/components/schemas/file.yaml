File:
  type: object
  description: A File is a downloadable artifact generated by Method, such as a raw credit report or credit report PDF.
  required:
  - id
  - type
  - mime_type
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the file.
      pattern: ^file_\w+$
      example: file_3mDnkR8Ft6Bx7
    type:
      type: string
      description: The type of file.
      enum:
      - raw_credit_report
      - credit_report_pdf
    mime_type:
      type: string
      description: MIME type of the file content.
    download_url:
      type:
      - string
      - 'null'
      description: Pre-signed URL for downloading the file. Only populated when a download URL has been minted.
    download_expires_at:
      type:
      - string
      - 'null'
      format: date-time
      description: Timestamp when the download URL expires.
    created_at:
      type: string
      format: date-time
      description: Timestamp when the file was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the file was last updated.
FileResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/File'
