File:
  type: object
  description: >-
    A File is a downloadable artifact generated by Method. Files cannot be
    created directly. They are produced as a result of other API requests and
    are referenced by the resource that generated them.
  required:
  - id
  - type
  - mime_type
  - download_url
  - download_expires_at
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the file.
      pattern: ^file_\w+$
      example: file_jZWkPMhXPeYAn
    type:
      type: string
      description: The type of artifact this file contains.
      enum:
      - raw_credit_report
      - credit_report_pdf
    mime_type:
      type: string
      description: The content type of the file, e.g. `application/json` or `application/pdf`.
      example: application/json
    download_url:
      type: string
      format: uri
      description: >-
        A temporary, pre-signed URL to the file's contents. A new URL is
        generated on every retrieve.
    download_expires_at:
      type: string
      format: date-time
      description: >-
        Timestamp when `download_url` expires. URLs are valid for 60 minutes
        (3600 seconds) by default. Retrieve the file again to receive a fresh
        URL.
    created_at:
      type: string
      format: date-time
      description: Timestamp when the file was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the file was last updated.
FileResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/File'
