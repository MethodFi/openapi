IntentEvent:
  type: string
  description: >-
    The journey event that the Intent represents. Method adds new events over time to
    support more use cases.

    - `user.signed_up`: The user created an account in your product.
    - `user.logged_in`: The user signed in to your product.
    - `user.session_started`: The user started a new session in your product.
    - `user.onboarding_started`: The user started your onboarding flow.
    - `user.onboarding_completed`: The user completed your onboarding flow.
    - `user.profile_updated`: The user updated their profile information.
    - `lending.prequalification_started`: The user started a prequalification flow.
    - `lending.prequalified`: The user was prequalified for an offer.
    - `lending.eligible_new`: The user became newly eligible for an offer.
    - `lending.eligible_maintain`: The user remains eligible for an offer. Use this event
      for ongoing eligibility checks.
    - `lending.application_started`: The user started an application.
    - `lending.application_submitted`: The user submitted an application.
    - `lending.offer_sent`: You sent the user a prescreened or prequalified offer.
    - `lending.offer_viewed`: The user viewed an offer.
    - `lending.offer_accepted`: The user accepted an offer.
    - `pfm.app_opened`: The user opened your personal finance app.
    - `pfm.dashboard_opened`: The user opened a dashboard that displays their liabilities.
    - `pfm.payoff_plan_started`: The user started building a debt payoff plan.
    - `pfm.payoff_plan_completed`: The user completed a debt payoff plan.
    - `commerce.item_added_to_cart`: The user added an item to a cart.
    - `commerce.checkout_started`: The user started checkout.
    - `commerce.payment_step_opened`: The user opened the payment step of checkout.
    - `commerce.payment_method_selected`: The user selected a payment method.
  enum:
  - user.signed_up
  - user.logged_in
  - user.session_started
  - user.onboarding_started
  - user.onboarding_completed
  - user.profile_updated
  - lending.prequalification_started
  - lending.prequalified
  - lending.eligible_new
  - lending.eligible_maintain
  - lending.application_started
  - lending.application_submitted
  - lending.offer_sent
  - lending.offer_viewed
  - lending.offer_accepted
  - pfm.app_opened
  - pfm.dashboard_opened
  - pfm.payoff_plan_started
  - pfm.payoff_plan_completed
  - commerce.item_added_to_cart
  - commerce.checkout_started
  - commerce.payment_step_opened
  - commerce.payment_method_selected
  example: lending.offer_sent

IntentSource:
  type: string
  description: The channel where the event occurred.
  enum:
  - website
  - app
  - email
  - chat
  example: email

Intent:
  type: object
  description: >-
    An Intent tells Method that a user is likely to onboard before you create their
    Entity. If Method recognizes the user, Method begins refreshing their eligible
    liability data in the background. Creating an Intent does not create an Entity, pull
    a credit report, or send webhooks, and the object does not indicate whether a match
    occurred.
  required:
  - id
  - event
  - context
  - metadata
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the Intent.
      pattern: ^int_evt_\w+$
      example: int_evt_aMm7rbqXxkqHR
    event:
      $ref: '#/IntentEvent'
    context:
      $ref: '#/IntentContext'
    metadata:
      $ref: common.yaml#/Metadata
    created_at:
      type: string
      format: date-time
      description: Timestamp when the Intent was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the Intent was last updated.
  example:
    id: int_evt_aMm7rbqXxkqHR
    event: lending.offer_sent
    context:
      external_user_id: usr_8f2d1c
      session_id: sess_41b7e9
      source: email
      client_ip_address: null
      client_user_agent: null
    metadata:
      campaign_id: fall_prescreen
    created_at: '2026-11-10T18:00:00.000Z'
    updated_at: '2026-11-10T18:00:00.000Z'

IntentContext:
  type: object
  description: Correlation fields provided when the Intent was created.
  required:
  - external_user_id
  - session_id
  - source
  - client_ip_address
  - client_user_agent
  properties:
    external_user_id:
      type:
      - string
      - 'null'
      description: Your identifier for the user.
      example: usr_8f2d1c
    session_id:
      type:
      - string
      - 'null'
      description: Your identifier for the user's session.
      example: sess_41b7e9
    source:
      type:
      - string
      - 'null'
      description: The channel where the event occurred.
      enum:
      - website
      - app
      - email
      - chat
      - null
      example: email
    client_ip_address:
      type:
      - string
      - 'null'
      description: The IPv4 or IPv6 address of the user's client.
      example: null
    client_user_agent:
      type:
      - string
      - 'null'
      description: The user agent of the user's client or browser.
      example: null

CreateIntentContext:
  type: object
  description: Optional correlation fields to store with the Intent.
  properties:
    external_user_id:
      type: string
      description: Your identifier for the user.
      example: usr_8f2d1c
    session_id:
      type: string
      description: Your identifier for the user's session.
      example: sess_41b7e9
    source:
      $ref: '#/IntentSource'
    client_ip_address:
      type: string
      description: The IPv4 or IPv6 address of the user's client.
      example: 203.0.113.42
    client_user_agent:
      type: string
      description: The user agent of the user's client or browser.
      example: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)

CreateIntentIndividual:
  type: object
  description: >-
    PII for a user who does not yet have an Entity. Provide `first_name` and `last_name`
    plus at least one of `phone`, `dob`, or `address`. Supplying more fields improves
    match accuracy.
  required:
  - first_name
  - last_name
  properties:
    first_name:
      type: string
      description: First name of the individual.
      example: Jane
    last_name:
      type: string
      description: Last name of the individual.
      example: Doe
    phone:
      type: string
      description: Phone number of the individual in E.164 format.
      pattern: '^\+\d{10,15}$'
      example: '+15125550123'
    email:
      type: string
      description: Email address of the individual.
      format: email
      example: jane@example.com
    dob:
      type: string
      format: date
      description: Date of birth of the individual (YYYY-MM-DD).
      example: '1990-05-21'
    address:
      $ref: common.yaml#/Address

CreateIntentIndividualIdentity:
  type: object
  description: Identify the user by PII when they do not yet have an Entity.
  required:
  - individual
  properties:
    individual:
      $ref: '#/CreateIntentIndividual'

CreateIntentEntityIdentity:
  type: object
  description: >-
    Identify the user by an existing Entity on your team. Method uses the individual
    linked to that Entity, so no PII is required.
  required:
  - entity_id
  properties:
    entity_id:
      type: string
      description: The ID of an existing Entity on your team.
      pattern: ^ent_\w+$
      example: ent_au22b1fbFJbp8

CreateIntentIdentity:
  description: >-
    The user the Intent refers to. Provide exactly one of `individual` or `entity_id`.
  oneOf:
  - $ref: '#/CreateIntentIndividualIdentity'
  - $ref: '#/CreateIntentEntityIdentity'

CreateIntentRequest:
  type: object
  description: Request body for creating an Intent.
  required:
  - event
  - identity
  properties:
    event:
      $ref: '#/IntentEvent'
    identity:
      $ref: '#/CreateIntentIdentity'
    context:
      $ref: '#/CreateIntentContext'
    metadata:
      $ref: common.yaml#/Metadata

IntentResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/Intent'
