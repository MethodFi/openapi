IntentEvent:
  type: string
  description: >-
    The user action that produced the intent. Events are grouped by journey: `user.*` for account
    lifecycle activity, `pfm.*` for personal-finance experiences, `lending.*` for credit applications
    and offers, and `commerce.*` for checkout flows.
  enum:
  - user.signed_up
  - user.logged_in
  - user.session_started
  - user.onboarding_started
  - user.onboarding_completed
  - user.profile_updated
  - pfm.app_opened
  - pfm.dashboard_opened
  - pfm.payoff_plan_started
  - pfm.payoff_plan_completed
  - lending.prequalification_started
  - lending.prequalified
  - lending.eligible_new
  - lending.eligible_maintain
  - lending.application_started
  - lending.application_submitted
  - lending.offer_sent
  - lending.offer_viewed
  - lending.offer_accepted
  - commerce.item_added_to_cart
  - commerce.checkout_started
  - commerce.payment_step_opened
  - commerce.payment_method_selected
  example: lending.application_started

IntentContext:
  type: object
  description: >-
    Session details captured with the intent. Every field is `null` when it was not provided on the
    request.
  required:
  - external_user_id
  - session_id
  - source
  - client_ip_address
  - client_user_agent
  properties:
    external_user_id:
      type:
      - string
      - 'null'
      description: Your identifier for the user who performed the action.
      example: usr_8842
    session_id:
      type:
      - string
      - 'null'
      description: Your identifier for the session in which the action occurred.
      example: sess_51c0
    source:
      type:
      - string
      - 'null'
      description: The channel through which the user performed the action.
      enum:
      - website
      - app
      - email
      - chat
      - null
      example: app
    client_ip_address:
      type:
      - string
      - 'null'
      description: IPv4 or IPv6 address of the user's device.
      example: 203.0.113.42
    client_user_agent:
      type:
      - string
      - 'null'
      description: User agent string of the user's device.
      example: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)

Intent:
  type: object
  description: >-
    An intent records a user action reported by your team. The submitted `identity` is not returned
    on the intent.
  required:
  - id
  - event
  - context
  - metadata
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the intent.
      pattern: ^int_evt_\w+$
      example: int_evt_PmK4qT7xVbN9c
    event:
      $ref: '#/IntentEvent'
    context:
      $ref: '#/IntentContext'
    metadata:
      $ref: common.yaml#/Metadata
    created_at:
      type: string
      format: date-time
      description: Timestamp when the intent was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the intent was last updated.
  example:
    id: int_evt_PmK4qT7xVbN9c
    event: lending.application_started
    context:
      external_user_id: usr_8842
      session_id: sess_51c0
      source: app
      client_ip_address: 203.0.113.42
      client_user_agent: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)
    metadata: null
    created_at: '2026-11-16T15:00:00.000Z'
    updated_at: '2026-11-16T15:00:00.000Z'

IntentResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/Intent'

CreateIntentRequest:
  type: object
  description: Request body for creating an intent. Unknown fields are rejected.
  required:
  - event
  - identity
  additionalProperties: false
  properties:
    event:
      $ref: '#/IntentEvent'
    identity:
      $ref: '#/CreateIntentIdentity'
    context:
      $ref: '#/CreateIntentContext'
    metadata:
      $ref: common.yaml#/Metadata

CreateIntentIdentity:
  description: >-
    The user who performed the action. Provide exactly one of `individual` or `entity_id`.
    Requests that include both, or neither, fail validation. `identity` is not returned on the
    intent.
  oneOf:
  - $ref: '#/CreateIntentIndividualIdentity'
  - $ref: '#/CreateIntentEntityIdentity'

CreateIntentIndividualIdentity:
  type: object
  description: Identifies the user by their PII.
  required:
  - individual
  additionalProperties: false
  properties:
    individual:
      $ref: '#/CreateIntentIndividual'

CreateIntentEntityIdentity:
  type: object
  description: Identifies the user by an existing entity that belongs to your team.
  required:
  - entity_id
  additionalProperties: false
  properties:
    entity_id:
      type: string
      description: >-
        The ID of an existing entity that belongs to your team. The request fails with
        `INVALID_ENTITY` when the entity does not belong to your team. Leading and trailing
        whitespace is trimmed.
      pattern: \S
      example: ent_au22b1fbFJbp8

CreateIntentIndividual:
  description: >-
    PII for the user who performed the action. `first_name` and `last_name` are required, along
    with a non-null value for at least one of `phone`, `dob`, or `address`.
  allOf:
  - type: object
    required:
    - first_name
    - last_name
    additionalProperties: false
    properties:
      first_name:
        type: string
        description: First name of the individual. Leading and trailing whitespace is trimmed.
        pattern: \S
        example: Jane
      last_name:
        type: string
        description: Last name of the individual. Leading and trailing whitespace is trimmed.
        pattern: \S
        example: Doe
      phone:
        type:
        - string
        - 'null'
        description: >-
          Phone number of the individual in E.164 format. The leading `+` is optional. May be
          `null` only when `dob` or `address` is provided.
        pattern: ^\+?[1-9]\d{1,14}$
        example: '+15125550123'
      email:
        type:
        - string
        - 'null'
        description: Email address of the individual.
        format: email
        example: jane@example.com
      dob:
        type:
        - string
        - 'null'
        description: >-
          Date of birth of the individual (YYYY-MM-DD). Must be on or after `1880-01-01` and at
          least 17 years before the current date. May be `null` only when `phone` or `address` is
          provided.
        format: date
        example: '1990-05-21'
      address:
        $ref: '#/CreateIntentAddress'
  - description: Requires a non-null value for at least one of `phone`, `dob`, or `address`.
    anyOf:
    - required:
      - phone
      properties:
        phone:
          not:
            type: 'null'
    - required:
      - dob
      properties:
        dob:
          not:
            type: 'null'
    - required:
      - address
      properties:
        address:
          not:
            type: 'null'

CreateIntentAddress:
  type:
  - object
  - 'null'
  description: >-
    Residential address of the individual. `zip` must fall within the ZIP code range of
    `state`. May be `null` only when `phone` or `dob` is provided.
  required:
  - line1
  - city
  - state
  - zip
  additionalProperties: false
  properties:
    line1:
      type: string
      description: Primary street address line.
      minLength: 1
      example: 123 Main St
    line2:
      description: Secondary address line, such as an apartment or suite. Any value is accepted.
      example: Apt 4B
    city:
      type: string
      description: City or locality.
      minLength: 1
      example: Austin
    state:
      type: string
      description: Two-letter US state or territory code.
      enum:
      - AL
      - AK
      - AZ
      - AR
      - CA
      - CZ
      - CO
      - CT
      - DE
      - DC
      - FL
      - GA
      - GU
      - HI
      - ID
      - IL
      - IN
      - IA
      - KS
      - KY
      - LA
      - ME
      - MD
      - MA
      - MI
      - MN
      - MS
      - MO
      - MT
      - NE
      - NV
      - NH
      - NJ
      - NM
      - NY
      - NC
      - ND
      - OH
      - OK
      - OR
      - PA
      - PR
      - RI
      - SC
      - SD
      - TN
      - TX
      - UT
      - VT
      - VI
      - VA
      - WA
      - WV
      - WI
      - WY
      example: TX
    zip:
      type: string
      description: Five-digit ZIP code, optionally followed by a hyphen and a four-digit extension.
      pattern: ^\d{5}(-\d{4})?$
      example: '78701'

CreateIntentContext:
  type:
  - object
  - 'null'
  description: >-
    Optional session details to capture with the intent. Omitted fields are returned as `null`.
  additionalProperties: false
  properties:
    external_user_id:
      type:
      - string
      - 'null'
      description: Your identifier for the user who performed the action.
      minLength: 1
      example: usr_8842
    session_id:
      type:
      - string
      - 'null'
      description: Your identifier for the session in which the action occurred.
      minLength: 1
      example: sess_51c0
    source:
      type:
      - string
      - 'null'
      description: The channel through which the user performed the action.
      enum:
      - website
      - app
      - email
      - chat
      - null
      example: app
    client_ip_address:
      type:
      - string
      - 'null'
      description: >-
        IPv4 or IPv6 address of the user's device. Must be a valid IP address; CIDR notation is
        also accepted.
      example: 203.0.113.42
    client_user_agent:
      type:
      - string
      - 'null'
      description: User agent string of the user's device.
      minLength: 1
      example: Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X)
