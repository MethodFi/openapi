ReportSchedule:
  type: object
  description: A Report Schedule defines a recurring schedule for generating and delivering reports.
  required:
  - id
  - types
  - delivery_methods
  - cron
  - status
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the report schedule.
      pattern: ^rpt_sch_\w+$
      example: rpt_sch_3mDnkR8Ft6Bx7
    types:
      type: array
      description: The types of reports generated by this schedule.
      items:
        $ref: '#/ReportScheduleType'
    delivery_methods:
      type: array
      description: The methods used to deliver the generated reports.
      items:
        $ref: '#/ReportScheduleDeliveryMethod'
    recipients:
      type:
      - array
      - 'null'
      description: Email recipients for reports delivered via email.
      items:
        type: string
    cron:
      type: string
      description: Cron expression defining when reports are generated.
      example: 0 8 * * 1-5
    status:
      $ref: '#/ReportScheduleStatus'
    created_at:
      type: string
      format: date-time
      description: Timestamp when the report schedule was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the report schedule was last updated.
ReportScheduleStatus:
  type: string
  description: Current status of the report schedule.
  enum:
  - active
  - inactive
ReportScheduleDeliveryMethod:
  type: string
  description: A delivery method for a report schedule.
  enum:
  - webhook
  - email
ReportScheduleType:
  type: string
  description: The type of report.
  enum:
  - payments.created.current
  - payments.created.previous
  - payments.created.previous_day
  - payments.updated.current
  - payments.updated.previous
  - payments.failed.previous_day
  - ach.pull.upcoming
  - ach.pull.previous
  - ach.pull.nightly
  - ach.reversals.nightly
  - ach.debit.daily
  - entities.created.previous_day
  - reserve_fbo_balance.created.previous_day
ReportScheduleCreateRequest:
  type: object
  description: Request body for creating a report schedule.
  required:
  - types
  - delivery_methods
  properties:
    types:
      type: array
      description: The types of reports to generate.
      items:
        $ref: '#/ReportScheduleType'
    delivery_methods:
      type: array
      description: The methods used to deliver the generated reports.
      items:
        $ref: '#/ReportScheduleDeliveryMethod'
    recipients:
      type:
      - array
      - 'null'
      description: Email recipients for reports delivered via email.
      items:
        type: string
    cron:
      type:
      - string
      - 'null'
      description: Cron expression defining when reports are generated. Defaults to `0 8 * * 1-5` when omitted.
ReportScheduleCronRequest:
  type: object
  description: Request body for updating a report schedule's cron expression.
  required:
  - cron
  properties:
    cron:
      type: string
      description: Cron expression defining when reports are generated.
      example: 0 8 * * 1-5
ReportScheduleTypesRequest:
  type: object
  description: Request body for adding or replacing report schedule types.
  required:
  - types
  properties:
    types:
      type: array
      description: The types of reports to add or set.
      items:
        $ref: '#/ReportScheduleType'
ReportScheduleDeliveryMethodsRequest:
  type: object
  description: Request body for adding or replacing report schedule delivery methods.
  required:
  - delivery_methods
  properties:
    delivery_methods:
      type: array
      description: The delivery methods to add or set.
      items:
        $ref: '#/ReportScheduleDeliveryMethod'
ReportScheduleRecipientsRequest:
  type: object
  description: Request body for adding or replacing report schedule recipients.
  required:
  - recipients
  properties:
    recipients:
      type: array
      description: The email recipients to add or set.
      items:
        type: string
ReportScheduleResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/ReportSchedule'
ReportScheduleListResponse:
  allOf:
  - $ref: common.yaml#/ListEnvelope
  - type: object
    properties:
      data:
        type: array
        items:
          $ref: '#/ReportSchedule'
