ReportScheduleType:
  type: string
  description: >-
    The Report type generated by the schedule. Method owns the run cadence for each
    supported type; the cadence is not configurable. All supported types currently run on
    business days at 8:00am America/Chicago. Non-business-day runs are skipped and resume
    on the next scheduled business day.
  enum:
  - ach.pull.nightly
  - ach.reversals.nightly
  - entities.created.previous_day
  - payments.created.previous_day
  - payments.failed.previous_day
  - reversals.pull_funded.previous_day
  - reversals.push_funded.previous_day
  example: payments.created.previous_day

ReportSchedule:
  type: object
  description: >-
    A Report Schedule automates recurring generation of a single Report `type`. Each
    scheduled run creates a Report exactly as `POST /reports` does, so it follows normal
    Report persistence and triggers the standard `report.create` webhook. When
    `email_recipients` are configured, Method also emails the CSV for the generated
    Report. A team may have only one active schedule per `type`.
  required:
  - id
  - type
  - email_recipients
  - status
  - created_at
  - updated_at
  properties:
    id:
      type: string
      description: Unique identifier for the report schedule.
      pattern: ^rpt_sch_\w+$
      example: rpt_sch_Gqjh8pzeUfzH6
    type:
      $ref: '#/ReportScheduleType'
    email_recipients:
      type: array
      description: >-
        Email addresses that receive the generated Report CSV after each run. An empty
        array means no email is sent; the Report is still created.
      items:
        type: string
        format: email
      example:
      - reports@example.com
    status:
      type: string
      description: Current status of the report schedule. `active` schedules run on their cadence.
      example: active
    created_at:
      type: string
      format: date-time
      description: Timestamp when the report schedule was created.
    updated_at:
      type: string
      format: date-time
      description: Timestamp when the report schedule was last updated.
  example:
    id: rpt_sch_Gqjh8pzeUfzH6
    type: payments.created.previous_day
    email_recipients:
    - reports@example.com
    status: active
    created_at: '2026-06-01T13:21:10.386Z'
    updated_at: '2026-06-01T13:21:10.386Z'

ReportScheduleCreateRequest:
  type: object
  description: >-
    Request body for creating a report schedule. Creating a second schedule for a `type`
    that already has an active schedule returns an error.
  required:
  - type
  properties:
    type:
      $ref: '#/ReportScheduleType'
    email_recipients:
      type: array
      description: Email addresses that receive the generated Report CSV after each run.
      items:
        type: string
        format: email
      example:
      - reports@example.com

ReportScheduleUpdateRequest:
  type: object
  description: >-
    Request body for updating a report schedule. The schedule `type` and cadence cannot be
    changed; create a new schedule instead.
  properties:
    email_recipients:
      type: array
      description: Replacement list of email addresses that receive the generated Report CSV.
      items:
        type: string
        format: email
      example:
      - ops@example.com
      - reports@example.com

ReportScheduleResponse:
  allOf:
  - $ref: common.yaml#/SuccessEnvelope
  - type: object
    properties:
      data:
        $ref: '#/ReportSchedule'

ReportScheduleListResponse:
  allOf:
  - $ref: common.yaml#/ListEnvelope
  - type: object
    properties:
      data:
        type: array
        items:
          $ref: '#/ReportSchedule'
